<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A4.F11.pic1.1" style="width:36.62em;">
<span class="ltx_p" id="A4.F11.pic1.1.1"><span class="ltx_text ltx_font_bold" id="A4.F11.pic1.1.1.1" style="--ltx-fg-color:#000000;">Summaries<span class="ltx_text ltx_font_medium" id="A4.F11.pic1.1.1.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A4.F11.pic1.1.2"><span class="ltx_text" id="A4.F11.pic1.1.2.1" style="--ltx-fg-color:#000000;">Below is a transcript of a conversation between a human user and an AI assistant. Please summarize the following dialogue as concisely as possible in a short paragraph, extracting the main themes and key information. In your summary, focus more on what the user mentioned or asked for. Dialogue content: {session or round} 
<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A4.F11.pic1.1.3"><span class="ltx_text ltx_font_bold" id="A4.F11.pic1.1.3.1" style="--ltx-fg-color:#000000;">Keyphrases<span class="ltx_text ltx_font_medium" id="A4.F11.pic1.1.3.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A4.F11.pic1.1.4"><span class="ltx_text" id="A4.F11.pic1.1.4.1" style="--ltx-fg-color:#000000;">Below is a transcript of a conversation between a human user and an AI assistant. Generate a list of keyphrases for the session. Separate each keyphrase with a semicolon. Dialogue content: {session or round}

<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A4.F11.pic1.1.5"><span class="ltx_text ltx_font_bold" id="A4.F11.pic1.1.5.1" style="--ltx-fg-color:#000000;">User Facts<span class="ltx_text ltx_font_medium" id="A4.F11.pic1.1.5.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A4.F11.pic1.1.6"><span class="ltx_text" id="A4.F11.pic1.1.6.1" style="--ltx-fg-color:#000000;">You will be given a list of messages from a human user to an AI assistant. Extract all the personal information, life events, experience, and preferences related to the user. Make sure you include all details such as life events, personal experience, preferences, specific numbers, locations, or dates. State each piece of information in a simple sentence. Put these sentences in a json list, each element being a standalone personal fact about the user. Minimize the coreference across the facts, e.g., replace pronouns with actual entities. If there is no specific events, personal information, or preference mentioned, just generate an empty list. 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A4.F11.pic1.1.7"><span class="ltx_text" id="A4.F11.pic1.1.7.1" style="--ltx-fg-color:#000000;">Human user messages: {session} 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A4.F11.pic1.1.8"><span class="ltx_text" id="A4.F11.pic1.1.8.1" style="--ltx-fg-color:#000000;">Personal facts about the user (a list of strings in json format; do not generate anything else): 
<br class="ltx_break"/></span></span>
</span></span></span></foreignObject></g></g></svg>