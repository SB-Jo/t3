<span class="ltx_p" id="A1.F7.pic1.1.1"><span class="ltx_text" id="A1.F7.pic1.1.1.1" style="--ltx-fg-color:#000000;">I will give you a topic. Please imagine you are a user that wants to recall and record recent personal facts along the topic. Generate a long text describing these personal facts. Use your imagination and generate the personal facts. Make it long and involve several recent facts or recent events spanning many days, weeks, or monthes. You may state the facts in plain language and no need to make it story-like.
