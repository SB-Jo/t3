<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A4.F12.pic1.1" style="width:36.62em;">
<span class="ltx_p" id="A4.F12.pic1.1.1"><span class="ltx_text ltx_font_bold" id="A4.F12.pic1.1.1.1" style="--ltx-fg-color:#000000;">Extracting Timestamped Events<span class="ltx_text ltx_font_medium" id="A4.F12.pic1.1.1.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A4.F12.pic1.1.2"><span class="ltx_text" id="A4.F12.pic1.1.2.1" style="--ltx-fg-color:#000000;">You will be given a list of messages from a human user to an AI assistant, as well as the time the conversation took place. Extract all events related to the user as long as its date is specified or could be inferred. If the time some event took place cannot be inferred, do not extract that event. Return the events in a json list where each item contains two fields: ”date” and ”event”. Write date in the form YYYY/MM/DD. If there is no specific event, just write an empty list. 
<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A4.F12.pic1.1.3"><span class="ltx_text ltx_font_bold" id="A4.F12.pic1.1.3.1" style="--ltx-fg-color:#000000;">Query Expansion<span class="ltx_text ltx_font_medium" id="A4.F12.pic1.1.3.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A4.F12.pic1.1.4"><span class="ltx_text" id="A4.F12.pic1.1.4.1" style="--ltx-fg-color:#000000;">You will be given a question from a human user asking about some prvious events, as well as the time the question is asked. Infer a potential time range such that the events happening in this range is likely to help to answer the question (a start date and an end date). Write a json dict two fields: ”start” and ”end”. Write date in the form YYYY/MM/DD. If the question does not have any temporal referencea, do not attempt to guess a time range. Instead, just say N/A.”</span></span>
</span></span></span></foreignObject></g></g></svg>