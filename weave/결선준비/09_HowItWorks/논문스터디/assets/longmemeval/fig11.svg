<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A1.F10.pic1.1" style="width:36.62em;">
<span class="ltx_p" id="A1.F10.pic1.1.1"><span class="ltx_text ltx_font_bold" id="A1.F10.pic1.1.1.1" style="--ltx-fg-color:#000000;">temp-reasoning<span class="ltx_text ltx_font_medium" id="A1.F10.pic1.1.1.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A1.F10.pic1.1.2"><span class="ltx_text" id="A1.F10.pic1.1.2.1" style="--ltx-fg-color:#000000;">I will give you a question, a correct answer, and a response from a model. Please answer yes if the response contains the correct answer. Otherwise, answer no. If the response is equivalent to the correct answer or contains all the intermediate steps to get the correct answer, you should also answer yes. If the response only contains a subset of the information required by the answer, answer no. In addition, do not penalize off-by-one errors for the number of days. If the question asks for the number of days/weeks/months, etc., and the model makes off-by-one errors (e.g., predicting 19 days when the answer is 18), the model’s response is still correct. 
<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A1.F10.pic1.1.3"><span class="ltx_text ltx_font_bold" id="A1.F10.pic1.1.3.1" style="--ltx-fg-color:#000000;">knowledge-update<span class="ltx_text ltx_font_medium" id="A1.F10.pic1.1.3.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A1.F10.pic1.1.4"><span class="ltx_text" id="A1.F10.pic1.1.4.1" style="--ltx-fg-color:#000000;">I will give you a question, a correct answer, and a response from a model. Please answer yes if the response contains the correct answer. Otherwise, answer no. If the response contains some previous information along with an updated answer, the response should be considered as correct as long as the updated answer is the required answer. 
<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A1.F10.pic1.1.5"><span class="ltx_text ltx_font_bold" id="A1.F10.pic1.1.5.1" style="--ltx-fg-color:#000000;">single-session-preference<span class="ltx_text ltx_font_medium" id="A1.F10.pic1.1.5.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A1.F10.pic1.1.6"><span class="ltx_text" id="A1.F10.pic1.1.6.1" style="--ltx-fg-color:#000000;">I will give you a question, a rubric for desired personalized response, and a response from a model. Please answer yes if the response satisfies the desired response. Otherwise, answer no. The model does not need to reflect all the points in the rubric. The response is correct as long as it recalls and utilizes the user’s personal information correctly. 
<br class="ltx_break"/></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span class="ltx_p" id="A1.F10.pic1.1.7"><span class="ltx_text ltx_font_bold" id="A1.F10.pic1.1.7.1" style="--ltx-fg-color:#000000;">Other question types<span class="ltx_text ltx_font_medium" id="A1.F10.pic1.1.7.1.1">
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A1.F10.pic1.1.8"><span class="ltx_text" id="A1.F10.pic1.1.8.1" style="--ltx-fg-color:#000000;">I will give you a question, a correct answer, and a response from a model. Please answer yes if the response contains the correct answer. Otherwise, answer no. If the response is equivalent to the correct answer or contains all the intermediate steps to get the correct answer, you should also answer yes. If the response only contains a subset of the information required by the answer, answer no.</span></span>
</span></span></span></foreignObject></g></g></svg>