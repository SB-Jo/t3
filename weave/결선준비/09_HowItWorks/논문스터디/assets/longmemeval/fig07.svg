<span class="ltx_p" id="A1.F8.pic1.1.1"><span class="ltx_text" id="A1.F8.pic1.1.1.1" style="--ltx-fg-color:#000000;">I will give you a past memory. Use the memory to act as a normal user to chat with a chat assistant. In the chat, you may ask it to assist you various tasks or ask it about various information. However, make sure that your convey the following fact about you: ”{evidence_statement}”. In addition, make sure your message is concise (1-2 simple sentences), since the real users often do not bother write a long message. I will provide you with the chat history and the response from the assistant. Directly generate the next response from the user’s perspective. You must simulate the tone of a neutral user and do not be overly enthusiastic, verbose, formal, or polite. For conciseness, DO NOT react to the assistant’s message with e.g., ”thanks” or ”I will do that”. Instead, directly state the follow-up questions or new questions.
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A1.F8.pic1.1.2"><span class="ltx_text" id="A1.F8.pic1.1.2.1" style="--ltx-fg-color:#000000;">Memory: {background} 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A1.F8.pic1.1.3"><span class="ltx_text" id="A1.F8.pic1.1.3.1" style="--ltx-fg-color:#000000;">Chat History: 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A1.F8.pic1.1.4"><span class="ltx_text" id="A1.F8.pic1.1.4.1" style="--ltx-fg-color:#000000;">assistant: Hi! How can I assist you today? 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A1.F8.pic1.1.5"><span class="ltx_text" id="A1.F8.pic1.1.5.1" style="--ltx-fg-color:#000000;">… (more rounds as the conversation continues) …</span></span>
</span></span></span></foreignObject></g></g></svg>