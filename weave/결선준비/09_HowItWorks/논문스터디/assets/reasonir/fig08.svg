<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A1.F7.pic1.2" style="width:46.64em;">
<span class="ltx_p" id="A1.F7.pic1.2.1"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.1.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.1.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p1">
<span class="ltx_p" id="A1.F7.pic1.p1.1">Brainstorm a list of text matching tasks where the queries are long documents.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.2" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.2.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F7.pic1.2.2.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.3" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.3.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.3.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p3">
<span class="ltx_p" id="A1.F7.pic1.p3.1">Here are a few examples:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.4" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.4.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.4.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.4.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.4.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p4">
<span class="ltx_p" id="A1.F7.pic1.p4.1">- Given a document that supports a debatable argument, find another document that contains opposite arguments.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.5" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.5.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.5.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.5.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.5.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p5">
<span class="ltx_p" id="A1.F7.pic1.p5.1">- Provided a lengthy business proposal, retrieve competitive business strategies in the same industry.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.6" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.6.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.6.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.6.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.6.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p6">
<span class="ltx_p" id="A1.F7.pic1.p6.1">- Provided a stackexchange lengthy question, retrieve relevant STEM knowledge from scientific papers.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.7" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.7.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.7.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.7.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.7.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p7">
<span class="ltx_p" id="A1.F7.pic1.p7.1">- Given a reasoning-intensive math or coding question, retrieve demonstrations from the textbooks that can help answer the questions.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.8" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.8.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F7.pic1.2.8.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F7.pic1.2.9" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F7.pic1.2.9.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.9.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F7.pic1.2.9.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F7.pic1.2.9.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F7.pic1.p9">
<span class="ltx_p" id="A1.F7.pic1.p9.1">Your output must always be a python list of strings only, with about 20 elements, and each element corresponds to a distinct task in one sentence. Do not explain yourself or output anything else. Be creative!</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>