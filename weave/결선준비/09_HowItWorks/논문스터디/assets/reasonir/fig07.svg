<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A1.F6.pic1.1" style="width:44.07em;">
<span class="ltx_p" id="A1.F6.pic1.1.1"><span class="ltx_text" id="A1.F6.pic1.1.1.1" style="--ltx-fg-color:#FFFFFF;">System prompt for multi-turn hard-negative generation</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignObject height="342.47" overflow="visible" style="--ltx-fo-width:46.64em;--ltx-fo-height:24.55em;--ltx-fo-depth:0.2em;font-size:10pt;" transform="matrix(1 0 0 -1 0 339.7)" width="645.37"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A1.F6.pic1.2" style="width:46.64em;">
<span class="ltx_p" id="A1.F6.pic1.2.1"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.1.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.1.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p1">
<span class="ltx_p" id="A1.F6.pic1.p1.1">You have been assigned a passage generation task:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.2" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.2.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.2.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.3" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.3.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.3.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p3">
<span class="ltx_p" id="A1.F6.pic1.p3.1">You will be provided an incomplete data with the below information</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.4" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.4.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.4.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p4">
<span class="ltx_p" id="A1.F6.pic1.p4.1">- "input": a string, a random input specified by one task.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.5" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.5.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.5.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p5">
<span class="ltx_p" id="A1.F6.pic1.p5.1">- "positive_document": a string, a relevant document for the "input" according to the task.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.6" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.6.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.6.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.7" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.7.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.7.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p7">
<span class="ltx_p" id="A1.F6.pic1.p7.1">Your task is to generate a "hard_negative_document" in a JSON format:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.8" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.8.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.8.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.8.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.8.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p8">
<span class="ltx_p" id="A1.F6.pic1.p8.1">- The "hard_negative_document" contains some relevant information with superficial lexical overlapping, but it should be not helpful to address the question in the input and is less relevant to the input compared with the "positive_document".</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.9" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.9.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.9.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.10" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.10.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.10.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p10">
<span class="ltx_p" id="A1.F6.pic1.p10.1">Please adhere to the following guidelines:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.11" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.11.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.11.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p11">
<span class="ltx_p" id="A1.F6.pic1.p11.1">- The values of "hard_negative_document" should be in English.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.12" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.12.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.12.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.12.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.12.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p12">
<span class="ltx_p" id="A1.F6.pic1.p12.1">- The "hard_negative_document" should be long documents (at least 300 words), avoid substantial word overlaps, otherwise the task would be too easy.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.13" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.13.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.13.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.13.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.13.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p13">
<span class="ltx_p" id="A1.F6.pic1.p13.1">- The "input", "positive_document", and "hard_negative_document" should be independent of each other.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.14" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.14.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.14.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.15" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.15.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.15.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F6.pic1.2.15.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.15.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p15">
<span class="ltx_p" id="A1.F6.pic1.p15.1">Your output must always be a JSON object only, do not explain yourself or output anything else. Be creative!</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.16" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.16.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.16.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.17" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.17.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.17.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p17">
<span class="ltx_p" id="A1.F6.pic1.p17.1">Now process the below data following the above instruction:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.18" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.18.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.18.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p18">
<span class="ltx_p" id="A1.F6.pic1.p18.1">’input’: \{query\}</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.19" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.19.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.19.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p19">
<span class="ltx_p" id="A1.F6.pic1.p19.1">’positive_document’: \{positive_document\}</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.20" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.20.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" id="A1.F6.pic1.2.20.1.1" style="width:440.7pt;"></span></span></span>
<span class="ltx_p" id="A1.F6.pic1.2.21" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F6.pic1.2.21.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F6.pic1.2.21.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F6.pic1.p21">
<span class="ltx_p" id="A1.F6.pic1.p21.1">Your response:</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>