<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A1.F13.pic1.2" style="width:46.64em;">
<span class="ltx_p" id="A1.F13.pic1.2.1"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.1.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.1.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p1">
<span class="ltx_p" id="A1.F13.pic1.p1.1">A document is relevant if it contains information that helps answer or address the query.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.2" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.2.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F13.pic1.2.2.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F13.pic1.2.2.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.2.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p2">
<span class="ltx_p" id="A1.F13.pic1.p2.1">A document is not relevant if it doesn’t contain information that helps answer the query, even if it mentions similar topics.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.3" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.3.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.3.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p3">
<span class="ltx_p" id="A1.F13.pic1.p3.1">Is the document below relevant to answering the query below?</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.4" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.4.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.4.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p4">
<span class="ltx_p" id="A1.F13.pic1.p4.1">The answer should be ’Relevance score: X.’ where X is a number from 0-5.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.5" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.5.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_text ltx_inline-block" id="A1.F13.pic1.2.5.1.1" style="width:0.0pt;"> </span><span class="ltx_text ltx_inline-block" id="A1.F13.pic1.2.5.1.2" style="width:0.0pt;"> </span><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.5.1.3" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p5">
<span class="ltx_p" id="A1.F13.pic1.p5.1">0 means completely irrelevant, 5 means highly relevant and completely addresses the query. Don’t output anything else.</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.6" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.6.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.6.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p6">
<span class="ltx_p" id="A1.F13.pic1.p6.1">Here is the query:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.7" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.7.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.7.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p7">
<span class="ltx_p" id="A1.F13.pic1.p7.1">&lt;start_query&gt;</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.8" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.8.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.8.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p8">
<span class="ltx_p" id="A1.F13.pic1.p8.1">{}</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.9" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.9.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.9.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p9">
<span class="ltx_p" id="A1.F13.pic1.p9.1">&lt;end_query&gt;</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.10" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.10.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.10.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p10">
<span class="ltx_p" id="A1.F13.pic1.p10.1">Here is the document:</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.11" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.11.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.11.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p11">
<span class="ltx_p" id="A1.F13.pic1.p11.1">&lt;start_document&gt;</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.12" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.12.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.12.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p12">
<span class="ltx_p" id="A1.F13.pic1.p12.1">{}</span>
</span></span></span></span>
<span class="ltx_p" id="A1.F13.pic1.2.13" style="width:440.7pt;"><span class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" id="A1.F13.pic1.2.13.1" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span class="ltx_inline-logical-block ltx_parbox ltx_align_top" id="A1.F13.pic1.2.13.1.1" style="width:440.7pt;">
<span class="ltx_para ltx_noindent" id="A1.F13.pic1.p13">
<span class="ltx_p" id="A1.F13.pic1.p13.1">&lt;end_document&gt;</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>