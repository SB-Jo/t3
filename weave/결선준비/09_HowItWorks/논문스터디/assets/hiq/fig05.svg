<span class="ltx_p" id="A15.F6.pic1.1.1"><span class="ltx_text" id="A15.F6.pic1.1.1.1" style="--ltx-fg-color:#FFFFFF;">Granularity Assessment (Root version)</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignObject height="375.99" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:27.17em;--ltx-fo-depth:0em;font-size:10pt;" transform="matrix(1 0 0 -1 0 375.99)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F6.pic1.2" style="width:31.37em;">
<span class="ltx_p" id="A15.F6.pic1.2.1"><span class="ltx_text" id="A15.F6.pic1.2.1.1" style="--ltx-fg-color:#000000;">You are an advanced reading comprehension assistant. 
<br class="ltx_break"/>Your task is to analyze text passages and corresponding questions meticulously.
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F6.pic1.2.2"><span class="ltx_text" id="A15.F6.pic1.2.2.1" style="--ltx-fg-color:#000000;">Always respond as a JSON object with the following structure: 
<br class="ltx_break"/><span class="ltx_text ltx_font_typewriter" id="A15.F6.pic1.2.2.1.1">
{ "thought": "&lt;methodically break down the reasoning process, illustrating how you arrive at conclusions&gt;", 
<br class="ltx_break"/>"answer": "&lt;a concise and definitive answer string&gt;" }
</span></span></span>
<span class="ltx_itemize" id="A15.I14">
<span class="ltx_item" id="A15.I14.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I14.i1.p1">
<span class="ltx_p" id="A15.I14.i1.p1.1"><span class="ltx_text" id="A15.I14.i1.p1.1.1" style="--ltx-fg-color:#000000;">If there is an answer, extract the answer span from the text passages.</span></span>
</span></span>
<span class="ltx_item" id="A15.I14.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I14.i2.p1">
<span class="ltx_p" id="A15.I14.i2.p1.1"><span class="ltx_text" id="A15.I14.i2.p1.1.1" style="--ltx-fg-color:#000000;">If there is no answer, respond with
</span><span class="ltx_text ltx_font_typewriter" id="A15.I14.i2.p1.1.2" style="--ltx-fg-color:#000000;">{ "thought": "&lt;methodically break down the reasoning process, illustrating how you arrive at conclusions&gt;", "answer": null }</span><span class="ltx_text" id="A15.I14.i2.p1.1.3" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F6.pic1.2.3"><span class="ltx_text" id="A15.F6.pic1.2.3.1" style="--ltx-fg-color:#000000;">Question: <span class="ltx_text ltx_font_typewriter" id="A15.F6.pic1.2.3.1.1">{question}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F6.pic1.2.4"><span class="ltx_text" id="A15.F6.pic1.2.4.1" style="--ltx-fg-color:#000000;">Documents: <span class="ltx_text ltx_font_typewriter" id="A15.F6.pic1.2.4.1.1">{documents}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F6.pic1.2.5"><span class="ltx_text" id="A15.F6.pic1.2.5.1" style="--ltx-fg-color:#000000;">Return the results in a FLAT JSON format. 
<br class="ltx_break"/><span class="ltx_text ltx_font_bold" id="A15.F6.pic1.2.5.1.1">DO NOT</span> include any explanations or notes in the output. <span class="ltx_text ltx_font_bold" id="A15.F6.pic1.2.5.1.2">ONLY</span> return JSON.</span></span>
</span></span></span></foreignObject></g></g></svg>