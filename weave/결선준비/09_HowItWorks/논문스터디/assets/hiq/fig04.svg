<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F5.pic1.1" style="width:31.37em;">
<span class="ltx_p" id="A15.F5.pic1.1.1"><span class="ltx_text" id="A15.F5.pic1.1.1.1" style="--ltx-fg-color:#FFFFFF;">Round-Trip Consistency Verification</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignObject height="1237.89" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:89.46em;--ltx-fo-depth:0em;font-size:10pt;" transform="matrix(1 0 0 -1 0 1237.89)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F5.pic1.2" style="width:31.37em;">
<span class="ltx_p" id="A15.F5.pic1.2.1"><span class="ltx_text" id="A15.F5.pic1.2.1.1" style="--ltx-fg-color:#000000;">You are a Decomposition Verification &amp; Repair Agent.
Your task is to verify and, if necessary, repair a proposed <span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.1.1.1">TWO-NEED</span> decomposition so that it faithfully represents the intent and constraints of the original multi-hop question. 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F5.pic1.2.2"><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.2.1" style="--ltx-fg-color:#000000;">You will be given:<span class="ltx_text" id="A15.F5.pic1.2.2.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I10">
<span class="ltx_item" id="A15.I10.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I10.i1.p1">
<span class="ltx_p" id="A15.I10.i1.p1.1"><span class="ltx_text" id="A15.I10.i1.p1.1.1" style="--ltx-fg-color:#000000;">An original multi-hop question</span></span>
</span></span>
<span class="ltx_item" id="A15.I10.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I10.i2.p1">
<span class="ltx_p" id="A15.I10.i2.p1.1"><span class="ltx_text" id="A15.I10.i2.p1.1.1" style="--ltx-fg-color:#000000;">A decomposition containing two needs: N1 and N2</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F5.pic1.2.3"><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.3.1" style="--ltx-fg-color:#000000;">Your tasks:<span class="ltx_text" id="A15.F5.pic1.2.3.1.1"></span></span></span>
<span class="ltx_enumerate" id="A15.I11">
<span class="ltx_item" id="A15.I11.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span>
<span class="ltx_para" id="A15.I11.i1.p1">
<span class="ltx_p" id="A15.I11.i1.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I11.i1.p1.1.1" style="--ltx-fg-color:#000000;">VERIFY:</span><span class="ltx_text" id="A15.I11.i1.p1.1.2" style="--ltx-fg-color:#000000;"> Check whether N1 and N2, when recomposed, are equivalent to the original question and capture </span><em class="ltx_emph ltx_font_italic" id="A15.I11.i1.p1.1.3" style="--ltx-fg-color:#000000;">all</em><span class="ltx_text" id="A15.I11.i1.p1.1.4" style="--ltx-fg-color:#000000;"> required constraints.</span></span>
</span></span>
<span class="ltx_item" id="A15.I11.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span>
<span class="ltx_para" id="A15.I11.i2.p1">
<span class="ltx_p" id="A15.I11.i2.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I11.i2.p1.1.1" style="--ltx-fg-color:#000000;">REPAIR (only if invalid):</span><span class="ltx_text" id="A15.I11.i2.p1.1.2" style="--ltx-fg-color:#000000;"> If the decomposition is invalid, produce a corrected decomposition that satisfies the full intent and constraints of the original question.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F5.pic1.2.4"><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.4.1" style="--ltx-fg-color:#000000;">Decomposition Rules:<span class="ltx_text ltx_font_medium" id="A15.F5.pic1.2.4.1.1">
Same as those defined in the <em class="ltx_emph ltx_font_italic" id="A15.F5.pic1.2.4.1.1.1">Binary Query Decomposition</em> prompt. 
<br class="ltx_break"/></span></span></span>
<span class="ltx_p" id="A15.F5.pic1.2.5"><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.5.1" style="--ltx-fg-color:#000000;">For each need, specify:<span class="ltx_text" id="A15.F5.pic1.2.5.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I12">
<span class="ltx_item" id="A15.I12.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I12.i1.p1">
<span class="ltx_p" id="A15.I12.i1.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I12.i1.p1.1.1" style="--ltx-fg-color:#000000;">id</span><span class="ltx_text" id="A15.I12.i1.p1.1.2" style="--ltx-fg-color:#000000;">: </span><span class="ltx_text ltx_font_typewriter" id="A15.I12.i1.p1.1.3" style="--ltx-fg-color:#000000;">N1</span><span class="ltx_text" id="A15.I12.i1.p1.1.4" style="--ltx-fg-color:#000000;"> or </span><span class="ltx_text ltx_font_typewriter" id="A15.I12.i1.p1.1.5" style="--ltx-fg-color:#000000;">N2</span><span class="ltx_text" id="A15.I12.i1.p1.1.6" style="--ltx-fg-color:#000000;"> only</span></span>
</span></span>
<span class="ltx_item" id="A15.I12.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I12.i2.p1">
<span class="ltx_p" id="A15.I12.i2.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I12.i2.p1.1.1" style="--ltx-fg-color:#000000;">text</span><span class="ltx_text" id="A15.I12.i2.p1.1.2" style="--ltx-fg-color:#000000;">: a declarative description of the information required</span></span>
</span></span>
<span class="ltx_item" id="A15.I12.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I12.i3.p1">
<span class="ltx_p" id="A15.I12.i3.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I12.i3.p1.1.1" style="--ltx-fg-color:#000000;">depends_on</span><span class="ltx_text" id="A15.I12.i3.p1.1.2" style="--ltx-fg-color:#000000;">: </span><span class="ltx_text ltx_font_typewriter" id="A15.I12.i3.p1.1.3" style="--ltx-fg-color:#000000;">[]</span><span class="ltx_text" id="A15.I12.i3.p1.1.4" style="--ltx-fg-color:#000000;"> for N1, </span><span class="ltx_text ltx_font_typewriter" id="A15.I12.i3.p1.1.5" style="--ltx-fg-color:#000000;">["N1"]</span><span class="ltx_text" id="A15.I12.i3.p1.1.6" style="--ltx-fg-color:#000000;"> for N2</span></span>
</span></span>
<span class="ltx_item" id="A15.I12.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I12.i4.p1">
<span class="ltx_p" id="A15.I12.i4.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I12.i4.p1.1.1" style="--ltx-fg-color:#000000;">subquery</span><span class="ltx_text" id="A15.I12.i4.p1.1.2" style="--ltx-fg-color:#000000;">: a concise natural-language question that retrieves the required information</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F5.pic1.2.6"><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.6.1" style="--ltx-fg-color:#000000;">Output Format:<span class="ltx_text" id="A15.F5.pic1.2.6.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I13">
<span class="ltx_item" id="A15.I13.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I13.i1.p1">
<span class="ltx_p" id="A15.I13.i1.p1.1"><span class="ltx_text" id="A15.I13.i1.p1.1.1" style="--ltx-fg-color:#000000;">Always output a </span><span class="ltx_text ltx_font_bold" id="A15.I13.i1.p1.1.2" style="--ltx-fg-color:#000000;">JSON object</span><span class="ltx_text" id="A15.I13.i1.p1.1.3" style="--ltx-fg-color:#000000;"> with </span><span class="ltx_text ltx_font_bold" id="A15.I13.i1.p1.1.4" style="--ltx-fg-color:#000000;">EXACTLY TWO</span><span class="ltx_text" id="A15.I13.i1.p1.1.5" style="--ltx-fg-color:#000000;"> top-level keys: </span><span class="ltx_text ltx_font_typewriter" id="A15.I13.i1.p1.1.6" style="--ltx-fg-color:#000000;">"thought"</span><span class="ltx_text" id="A15.I13.i1.p1.1.7" style="--ltx-fg-color:#000000;"> and </span><span class="ltx_text ltx_font_typewriter" id="A15.I13.i1.p1.1.8" style="--ltx-fg-color:#000000;">"needs"</span><span class="ltx_text" id="A15.I13.i1.p1.1.9" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span class="ltx_item" id="A15.I13.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I13.i2.p1">
<span class="ltx_p" id="A15.I13.i2.p1.1"><span class="ltx_text" id="A15.I13.i2.p1.1.1" style="--ltx-fg-color:#000000;">If the decomposition is </span><span class="ltx_text ltx_font_bold" id="A15.I13.i2.p1.1.2" style="--ltx-fg-color:#000000;">valid</span><span class="ltx_text" id="A15.I13.i2.p1.1.3" style="--ltx-fg-color:#000000;"> and already satisfies all constraints:</span></span>
<span class="ltx_itemize" id="A15.I13.i2.I1">
<span class="ltx_item" id="A15.I13.i2.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold" id="A15.I13.i2.I1.i1.1">–</span></span>
<span class="ltx_para" id="A15.I13.i2.I1.i1.p1">
<span class="ltx_p" id="A15.I13.i2.I1.i1.p1.1"><span class="ltx_text" id="A15.I13.i2.I1.i1.p1.1.1" style="--ltx-fg-color:#000000;">Set </span><span class="ltx_text ltx_font_typewriter" id="A15.I13.i2.I1.i1.p1.1.2" style="--ltx-fg-color:#000000;">"needs"</span><span class="ltx_text" id="A15.I13.i2.I1.i1.p1.1.3" style="--ltx-fg-color:#000000;"> to </span><span class="ltx_text ltx_font_typewriter" id="A15.I13.i2.I1.i1.p1.1.4" style="--ltx-fg-color:#000000;">null</span><span class="ltx_text" id="A15.I13.i2.I1.i1.p1.1.5" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span>
<span class="ltx_item" id="A15.I13.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I13.i3.p1">
<span class="ltx_p" id="A15.I13.i3.p1.1"><span class="ltx_text" id="A15.I13.i3.p1.1.1" style="--ltx-fg-color:#000000;">If the decomposition is </span><span class="ltx_text ltx_font_bold" id="A15.I13.i3.p1.1.2" style="--ltx-fg-color:#000000;">invalid</span><span class="ltx_text" id="A15.I13.i3.p1.1.3" style="--ltx-fg-color:#000000;">:</span></span>
<span class="ltx_itemize" id="A15.I13.i3.I1">
<span class="ltx_item" id="A15.I13.i3.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold" id="A15.I13.i3.I1.i1.1">–</span></span>
<span class="ltx_para" id="A15.I13.i3.I1.i1.p1">
<span class="ltx_p" id="A15.I13.i3.I1.i1.p1.1"><span class="ltx_text" id="A15.I13.i3.I1.i1.p1.1.1" style="--ltx-fg-color:#000000;">Set </span><span class="ltx_text ltx_font_typewriter" id="A15.I13.i3.I1.i1.p1.1.2" style="--ltx-fg-color:#000000;">"needs"</span><span class="ltx_text" id="A15.I13.i3.I1.i1.p1.1.3" style="--ltx-fg-color:#000000;"> to the corrected two-need decomposition.</span></span>
</span></span>
</span>
</span></span>
</span>
<span class="ltx_p" id="A15.F5.pic1.2.7"><span class="ltx_text" id="A15.F5.pic1.2.7.1" style="--ltx-fg-color:#000000;">Question: <span class="ltx_text ltx_font_typewriter" id="A15.F5.pic1.2.7.1.1">{question}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F5.pic1.2.8"><span class="ltx_text" id="A15.F5.pic1.2.8.1" style="--ltx-fg-color:#000000;">Decomposition: <span class="ltx_text ltx_font_typewriter" id="A15.F5.pic1.2.8.1.1">{decomposition}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F5.pic1.2.9"><span class="ltx_text" id="A15.F5.pic1.2.9.1" style="--ltx-fg-color:#000000;">Return the results in a FLAT JSON format. 
<br class="ltx_break"/><span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.9.1.1">DO NOT</span> include any explanations or notes in the output. <span class="ltx_text ltx_font_bold" id="A15.F5.pic1.2.9.1.2">ONLY</span> return JSON.</span></span>
</span></span></span></foreignObject></g></g></svg>