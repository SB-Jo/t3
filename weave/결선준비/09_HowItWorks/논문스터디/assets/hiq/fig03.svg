]]></style><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,1458.69) matrix(1 0 0 -1 0 0)"><g fill="#000000" fill-opacity="1.0" style="--ltx-fill-color:#000000;"><path d="M 0 0 L 0 1458.69 L 477.38 1458.69 L 477.38 0 Z" style="stroke:none"></path></g><g fill="#F2F2F2" fill-opacity="1.0" style="--ltx-fill-color:#F2F2F2;"><path d="M 1.97 1.97 L 1.97 1434.74 L 475.41 1434.74 L 475.41 1.97 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1443.33)"><foreignObject height="12.15" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.19em;font-size:10pt;" transform="matrix(1 0 0 -1 0 9.46)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F4.pic1.1" style="width:31.37em;">
<span class="ltx_p" id="A15.F4.pic1.1.1"><span class="ltx_text" id="A15.F4.pic1.1.1.1" style="--ltx-fg-color:#FFFFFF;">Binary Query Decomposition</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignObject height="1409.16" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:101.84em;--ltx-fo-depth:0em;font-size:10pt;" transform="matrix(1 0 0 -1 0 1409.16)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F4.pic1.2" style="width:31.37em;">
<span class="ltx_p" id="A15.F4.pic1.2.1"><span class="ltx_text" id="A15.F4.pic1.2.1.1" style="--ltx-fg-color:#000000;">You are a Multi-hop Question Decomposition Agent.
Your task is to analyze a given question and determine whether it exhibits a dependency structure that can be decomposed into <span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.1.1.1">EXACTLY TWO</span> information needs connected by a conceptual or factual <span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.1.1.2">BRIDGE</span>.
A <span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.1.1.3">BRIDGE</span> is a pivot fact that must be resolved first in order to answer the final question. 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F4.pic1.2.2"><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.2.1" style="--ltx-fg-color:#000000;">Typical BRIDGEs include:<span class="ltx_text" id="A15.F4.pic1.2.2.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I5">
<span class="ltx_item" id="A15.I5.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I5.i1.p1">
<span class="ltx_p" id="A15.I5.i1.p1.1"><span class="ltx_text" id="A15.I5.i1.p1.1.1" style="--ltx-fg-color:#000000;">Key entities (persons, organizations, locations, dates)</span></span>
</span></span>
<span class="ltx_item" id="A15.I5.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I5.i2.p1">
<span class="ltx_p" id="A15.I5.i2.p1.1"><span class="ltx_text" id="A15.I5.i2.p1.1.1" style="--ltx-fg-color:#000000;">Important noun phrases (titles, concepts, objects)</span></span>
</span></span>
<span class="ltx_item" id="A15.I5.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I5.i3.p1">
<span class="ltx_p" id="A15.I5.i3.p1.1"><span class="ltx_text" id="A15.I5.i3.p1.1.1" style="--ltx-fg-color:#000000;">Logical or temporal relationships (cause, dependency, sequence)</span></span>
</span></span>
<span class="ltx_item" id="A15.I5.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I5.i4.p1">
<span class="ltx_p" id="A15.I5.i4.p1.1"><span class="ltx_text" id="A15.I5.i4.p1.1.1" style="--ltx-fg-color:#000000;">Explicit constraints stated in the question</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F4.pic1.2.3"><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.3.1" style="--ltx-fg-color:#000000;">Decomposition Instructions:<span class="ltx_text" id="A15.F4.pic1.2.3.1.1"></span></span></span>
<span class="ltx_enumerate" id="A15.I6">
<span class="ltx_item" id="A15.I6.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span>
<span class="ltx_para" id="A15.I6.i1.p1">
<span class="ltx_p" id="A15.I6.i1.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I6.i1.p1.1.1" style="--ltx-fg-color:#000000;">If the question requires an intermediate BRIDGE:</span><span class="ltx_text" id="A15.I6.i1.p1.1.2" style="--ltx-fg-color:#000000;"> Decompose it into </span><span class="ltx_text ltx_font_bold" id="A15.I6.i1.p1.1.3" style="--ltx-fg-color:#000000;">EXACTLY TWO</span><span class="ltx_text" id="A15.I6.i1.p1.1.4" style="--ltx-fg-color:#000000;"> needs:</span></span>
<span class="ltx_itemize" id="A15.I6.i1.I1">
<span class="ltx_item" id="A15.I6.i1.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I6.i1.I1.i1.p1">
<span class="ltx_p" id="A15.I6.i1.I1.i1.p1.1"><span class="ltx_text" id="A15.I6.i1.I1.i1.p1.1.1" style="--ltx-fg-color:#000000;">(N1) The pivot need that establishes the bridge</span></span>
</span></span>
<span class="ltx_item" id="A15.I6.i1.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I6.i1.I1.i2.p1">
<span class="ltx_p" id="A15.I6.i1.I1.i2.p1.1"><span class="ltx_text" id="A15.I6.i1.I1.i2.p1.1.1" style="--ltx-fg-color:#000000;">(N2) The dependent need that uses the resolved bridge to reach the final answer</span></span>
</span></span>
</span>
</span></span>
<span class="ltx_item" id="A15.I6.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span>
<span class="ltx_para" id="A15.I6.i2.p1">
<span class="ltx_p" id="A15.I6.i2.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I6.i2.p1.1.1" style="--ltx-fg-color:#000000;">If there is no intermediate BRIDGE</span><span class="ltx_text" id="A15.I6.i2.p1.1.2" style="--ltx-fg-color:#000000;"> and the question therefore cannot be decomposed into two dependent needs: Do </span><span class="ltx_text ltx_font_bold" id="A15.I6.i2.p1.1.3" style="--ltx-fg-color:#000000;">NOT</span><span class="ltx_text" id="A15.I6.i2.p1.1.4" style="--ltx-fg-color:#000000;"> decompose.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F4.pic1.2.4"><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.4.1" style="--ltx-fg-color:#000000;">Rules:<span class="ltx_text" id="A15.F4.pic1.2.4.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I7">
<span class="ltx_item" id="A15.I7.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I7.i1.p1">
<span class="ltx_p" id="A15.I7.i1.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I7.i1.p1.1.1" style="--ltx-fg-color:#000000;">NEVER</span><span class="ltx_text" id="A15.I7.i1.p1.1.2" style="--ltx-fg-color:#000000;"> produce more than two needs.</span></span>
</span></span>
<span class="ltx_item" id="A15.I7.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I7.i2.p1">
<span class="ltx_p" id="A15.I7.i2.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I7.i2.p1.1.1" style="--ltx-fg-color:#000000;">NEVER</span><span class="ltx_text" id="A15.I7.i2.p1.1.2" style="--ltx-fg-color:#000000;"> produce fewer than two needs when decomposing.</span></span>
</span></span>
<span class="ltx_item" id="A15.I7.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I7.i3.p1">
<span class="ltx_p" id="A15.I7.i3.p1.1"><span class="ltx_text ltx_font_bold" id="A15.I7.i3.p1.1.1" style="--ltx-fg-color:#000000;">N2 MUST</span><span class="ltx_text" id="A15.I7.i3.p1.1.2" style="--ltx-fg-color:#000000;"> logically depend on N1.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F4.pic1.2.5"><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.5.1" style="--ltx-fg-color:#000000;">For each need, specify:<span class="ltx_text" id="A15.F4.pic1.2.5.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I8">
<span class="ltx_item" id="A15.I8.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I8.i1.p1">
<span class="ltx_p" id="A15.I8.i1.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I8.i1.p1.1.1" style="--ltx-fg-color:#000000;">id</span><span class="ltx_text" id="A15.I8.i1.p1.1.2" style="--ltx-fg-color:#000000;">: </span><span class="ltx_text ltx_font_typewriter" id="A15.I8.i1.p1.1.3" style="--ltx-fg-color:#000000;">N1</span><span class="ltx_text" id="A15.I8.i1.p1.1.4" style="--ltx-fg-color:#000000;"> or </span><span class="ltx_text ltx_font_typewriter" id="A15.I8.i1.p1.1.5" style="--ltx-fg-color:#000000;">N2</span><span class="ltx_text" id="A15.I8.i1.p1.1.6" style="--ltx-fg-color:#000000;"> only</span></span>
</span></span>
<span class="ltx_item" id="A15.I8.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I8.i2.p1">
<span class="ltx_p" id="A15.I8.i2.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I8.i2.p1.1.1" style="--ltx-fg-color:#000000;">text</span><span class="ltx_text" id="A15.I8.i2.p1.1.2" style="--ltx-fg-color:#000000;">: a declarative description of the information required</span></span>
</span></span>
<span class="ltx_item" id="A15.I8.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I8.i3.p1">
<span class="ltx_p" id="A15.I8.i3.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I8.i3.p1.1.1" style="--ltx-fg-color:#000000;">depends_on</span><span class="ltx_text" id="A15.I8.i3.p1.1.2" style="--ltx-fg-color:#000000;">: </span><span class="ltx_text ltx_font_typewriter" id="A15.I8.i3.p1.1.3" style="--ltx-fg-color:#000000;">[]</span><span class="ltx_text" id="A15.I8.i3.p1.1.4" style="--ltx-fg-color:#000000;"> for N1, </span><span class="ltx_text ltx_font_typewriter" id="A15.I8.i3.p1.1.5" style="--ltx-fg-color:#000000;">["N1"]</span><span class="ltx_text" id="A15.I8.i3.p1.1.6" style="--ltx-fg-color:#000000;"> for N2</span></span>
</span></span>
<span class="ltx_item" id="A15.I8.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I8.i4.p1">
<span class="ltx_p" id="A15.I8.i4.p1.1"><span class="ltx_text ltx_font_typewriter" id="A15.I8.i4.p1.1.1" style="--ltx-fg-color:#000000;">subquery</span><span class="ltx_text" id="A15.I8.i4.p1.1.2" style="--ltx-fg-color:#000000;">: a concise natural-language question that retrieves the required information</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F4.pic1.2.6"><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.6.1" style="--ltx-fg-color:#000000;">Output Format:<span class="ltx_text" id="A15.F4.pic1.2.6.1.1"></span></span></span>
<span class="ltx_itemize" id="A15.I9">
<span class="ltx_item" id="A15.I9.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I9.i1.p1">
<span class="ltx_p" id="A15.I9.i1.p1.1"><span class="ltx_text" id="A15.I9.i1.p1.1.1" style="--ltx-fg-color:#000000;">Always output a </span><span class="ltx_text ltx_font_bold" id="A15.I9.i1.p1.1.2" style="--ltx-fg-color:#000000;">JSON object</span><span class="ltx_text" id="A15.I9.i1.p1.1.3" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span class="ltx_item" id="A15.I9.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I9.i2.p1">
<span class="ltx_p" id="A15.I9.i2.p1.1"><span class="ltx_text" id="A15.I9.i2.p1.1.1" style="--ltx-fg-color:#000000;">Use </span><span class="ltx_text ltx_font_bold" id="A15.I9.i2.p1.1.2" style="--ltx-fg-color:#000000;">EXACTLY TWO</span><span class="ltx_text" id="A15.I9.i2.p1.1.3" style="--ltx-fg-color:#000000;"> top-level keys: </span><span class="ltx_text ltx_font_typewriter" id="A15.I9.i2.p1.1.4" style="--ltx-fg-color:#000000;">"thought"</span><span class="ltx_text" id="A15.I9.i2.p1.1.5" style="--ltx-fg-color:#000000;"> and </span><span class="ltx_text ltx_font_typewriter" id="A15.I9.i2.p1.1.6" style="--ltx-fg-color:#000000;">"needs"</span><span class="ltx_text" id="A15.I9.i2.p1.1.7" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span class="ltx_item" id="A15.I9.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I9.i3.p1">
<span class="ltx_p" id="A15.I9.i3.p1.1"><span class="ltx_text" id="A15.I9.i3.p1.1.1" style="--ltx-fg-color:#000000;">If the question cannot be decomposed into two dependent needs, return:</span></span>
<span class="ltx_p ltx_align_center" id="A15.I9.i3.p1.2"><span class="ltx_text ltx_font_typewriter" id="A15.I9.i3.p1.2.1" style="--ltx-fg-color:#000000;">{"thought": "...", "needs": null}</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F4.pic1.2.7"><span class="ltx_text" id="A15.F4.pic1.2.7.1" style="--ltx-fg-color:#000000;">Question: <span class="ltx_text ltx_font_typewriter" id="A15.F4.pic1.2.7.1.1">{question}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F4.pic1.2.8"><span class="ltx_text" id="A15.F4.pic1.2.8.1" style="--ltx-fg-color:#000000;">Return the results in a FLAT JSON format. 
<br class="ltx_break"/><span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.8.1.1">DO NOT</span> include any explanations or notes in the output. <span class="ltx_text ltx_font_bold" id="A15.F4.pic1.2.8.1.2">ONLY</span> return JSON.</span></span>
</span></span></span></foreignObject></g></g></svg>