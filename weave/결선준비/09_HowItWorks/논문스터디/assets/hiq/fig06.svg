]]></style><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,947.03) matrix(1 0 0 -1 0 0)"><g fill="#000000" fill-opacity="1.0" style="--ltx-fill-color:#000000;"><path d="M 0 0 L 0 947.03 L 477.38 947.03 L 477.38 0 Z" style="stroke:none"></path></g><g fill="#F2F2F2" fill-opacity="1.0" style="--ltx-fill-color:#F2F2F2;"><path d="M 1.97 1.97 L 1.97 921.38 L 475.41 921.38 L 475.41 1.97 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 930.75)"><foreignObject height="13.84" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" transform="matrix(1 0 0 -1 0 10.38)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F7.pic1.1" style="width:31.37em;">
<span class="ltx_p" id="A15.F7.pic1.1.1"><span class="ltx_text" id="A15.F7.pic1.1.1.1" style="--ltx-fg-color:#FFFFFF;">Granularity Assessment (Recursive version)</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignObject height="895.8" overflow="visible" style="--ltx-fo-width:31.37em;--ltx-fo-height:64.74em;--ltx-fo-depth:0em;font-size:10pt;" transform="matrix(1 0 0 -1 0 895.8)" width="434.07"><span class="ltx_foreignobject_container" xmlns="http://www.w3.org/1999/xhtml"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" id="A15.F7.pic1.2" style="width:31.37em;">
<span class="ltx_p" id="A15.F7.pic1.2.1"><span class="ltx_text" id="A15.F7.pic1.2.1.1" style="--ltx-fg-color:#000000;">You are a QA assistant. 
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F7.pic1.2.2"><span class="ltx_text" id="A15.F7.pic1.2.2.1" style="--ltx-fg-color:#000000;">Context:</span></span>
<span class="ltx_itemize" id="A15.I15">
<span class="ltx_item" id="A15.I15.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i1.p1">
<span class="ltx_p" id="A15.I15.i1.p1.1"><span class="ltx_text" id="A15.I15.i1.p1.1.1" style="--ltx-fg-color:#000000;">The ORIGINAL QUESTION is being solved through multiple intermediate steps.</span></span>
</span></span>
<span class="ltx_item" id="A15.I15.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i2.p1">
<span class="ltx_p" id="A15.I15.i2.p1.1"><span class="ltx_text" id="A15.I15.i2.p1.1.1" style="--ltx-fg-color:#000000;">Some intermediate facts have ALREADY been resolved in previous steps.</span></span>
</span></span>
<span class="ltx_item" id="A15.I15.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i3.p1">
<span class="ltx_p" id="A15.I15.i3.p1.1"><span class="ltx_text" id="A15.I15.i3.p1.1.1" style="--ltx-fg-color:#000000;">These resolved facts are provided in the Current Document Context.</span></span>
</span></span>
<span class="ltx_item" id="A15.I15.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i4.p1">
<span class="ltx_p" id="A15.I15.i4.p1.1"><span class="ltx_text" id="A15.I15.i4.p1.1.1" style="--ltx-fg-color:#000000;">The current SUBQUESTION is derived from that context and represents ONLY ONE intermediate step.</span></span>
</span></span>
<span class="ltx_item" id="A15.I15.i5" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i5.p1">
<span class="ltx_p" id="A15.I15.i5.p1.1"><span class="ltx_text" id="A15.I15.i5.p1.1.1" style="--ltx-fg-color:#000000;">There may be further steps after this one.</span></span>
</span></span>
<span class="ltx_item" id="A15.I15.i6" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I15.i6.p1">
<span class="ltx_p" id="A15.I15.i6.p1.1"><span class="ltx_text" id="A15.I15.i6.p1.1.1" style="--ltx-fg-color:#000000;">The ORIGINAL QUESTION and the Current Document Context are provided ONLY to help you interpret the SUBQUESTION.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F7.pic1.2.3"><span class="ltx_text" id="A15.F7.pic1.2.3.1" style="--ltx-fg-color:#000000;">Your task:</span></span>
<span class="ltx_itemize" id="A15.I16">
<span class="ltx_item" id="A15.I16.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I16.i1.p1">
<span class="ltx_p" id="A15.I16.i1.p1.1"><span class="ltx_text" id="A15.I16.i1.p1.1.1" style="--ltx-fg-color:#000000;">Answer ONLY the given SUBQUESTION.</span></span>
</span></span>
<span class="ltx_item" id="A15.I16.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I16.i2.p1">
<span class="ltx_p" id="A15.I16.i2.p1.1"><span class="ltx_text" id="A15.I16.i2.p1.1.1" style="--ltx-fg-color:#000000;">Do NOT attempt to answer the ORIGINAL QUESTION.</span></span>
</span></span>
<span class="ltx_item" id="A15.I16.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I16.i3.p1">
<span class="ltx_p" id="A15.I16.i3.p1.1"><span class="ltx_text" id="A15.I16.i3.p1.1.1" style="--ltx-fg-color:#000000;">You may use the ORIGINAL QUESTION to understand how the result will be used.</span></span>
</span></span>
<span class="ltx_item" id="A15.I16.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I16.i4.p1">
<span class="ltx_p" id="A15.I16.i4.p1.1"><span class="ltx_text" id="A15.I16.i4.p1.1.1" style="--ltx-fg-color:#000000;">If the SUBQUESTION is NOT the final step toward answering the ORIGINAL QUESTION, return the answer that will be most useful for subsequent reasoning steps.</span></span>
</span></span>
<span class="ltx_item" id="A15.I16.i5" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I16.i5.p1">
<span class="ltx_p" id="A15.I16.i5.p1.1"><span class="ltx_text" id="A15.I16.i5.p1.1.1" style="--ltx-fg-color:#000000;">If the SUBQUESTION IS the final step, return the answer directly.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F7.pic1.2.4"><span class="ltx_text" id="A15.F7.pic1.2.4.1" style="--ltx-fg-color:#000000;">Always respond as a JSON object with the following structure: 
<br class="ltx_break"/><span class="ltx_text ltx_font_typewriter" id="A15.F7.pic1.2.4.1.1">
{ "thought": "&lt;methodically break down the reasoning process, illustrating how you arrive at conclusions&gt;", 
<br class="ltx_break"/>"answer": "&lt;a concise and definitive answer string&gt;" }
</span></span></span>
<span class="ltx_itemize" id="A15.I17">
<span class="ltx_item" id="A15.I17.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I17.i1.p1">
<span class="ltx_p" id="A15.I17.i1.p1.1"><span class="ltx_text" id="A15.I17.i1.p1.1.1" style="--ltx-fg-color:#000000;">- If there are MULTIPLE valid answers to the SUBQUESTION, return ALL of them.</span></span>
</span></span>
<span class="ltx_item" id="A15.I17.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="A15.I17.i2.p1">
<span class="ltx_p" id="A15.I17.i2.p1.1"><span class="ltx_text" id="A15.I17.i2.p1.1.1" style="--ltx-fg-color:#000000;">If there is no answer, respond with
</span><span class="ltx_text ltx_font_typewriter" id="A15.I17.i2.p1.1.2" style="--ltx-fg-color:#000000;">{ "thought": "&lt;methodically break down the reasoning process, illustrating how you arrive at conclusions&gt;", "answer": null }</span><span class="ltx_text" id="A15.I17.i2.p1.1.3" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span class="ltx_p" id="A15.F7.pic1.2.5"><span class="ltx_text" id="A15.F7.pic1.2.5.1" style="--ltx-fg-color:#000000;">Original Question: <span class="ltx_text ltx_font_typewriter" id="A15.F7.pic1.2.5.1.1">{original question}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F7.pic1.2.6"><span class="ltx_text" id="A15.F7.pic1.2.6.1" style="--ltx-fg-color:#000000;">Current Document Context: <span class="ltx_text ltx_font_typewriter" id="A15.F7.pic1.2.6.1.1">{retrieved documents so far}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F7.pic1.2.7"><span class="ltx_text" id="A15.F7.pic1.2.7.1" style="--ltx-fg-color:#000000;">Subquestion: <span class="ltx_text ltx_font_typewriter" id="A15.F7.pic1.2.7.1.1">{sub question}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F7.pic1.2.8"><span class="ltx_text" id="A15.F7.pic1.2.8.1" style="--ltx-fg-color:#000000;">Documents: <span class="ltx_text ltx_font_typewriter" id="A15.F7.pic1.2.8.1.1">{documents}</span>
<br class="ltx_break"/></span></span>
<span class="ltx_p" id="A15.F7.pic1.2.9"><span class="ltx_text" id="A15.F7.pic1.2.9.1" style="--ltx-fg-color:#000000;">Return the results in a FLAT JSON format. 
<br class="ltx_break"/><span class="ltx_text ltx_font_bold" id="A15.F7.pic1.2.9.1.1">DO NOT</span> include any explanations or notes in the output. <span class="ltx_text ltx_font_bold" id="A15.F7.pic1.2.9.1.2">ONLY</span> return JSON.</span></span>
</span></span></span></foreignObject></g></g></svg>