<span class="ltx_p" id="A15.F8.pic1.2.8"><span class="ltx_text" id="A15.F8.pic1.2.8.1" style="--ltx-fg-color:#000000;">Return the results in a FLAT JSON format. 
<br class="ltx_break"/><span class="ltx_text ltx_font_bold" id="A15.F8.pic1.2.8.1.1">DO NOT</span> include any explanations or notes in the output. <span class="ltx_text ltx_font_bold" id="A15.F8.pic1.2.8.1.2">ONLY</span> return JSON.</span></span>
