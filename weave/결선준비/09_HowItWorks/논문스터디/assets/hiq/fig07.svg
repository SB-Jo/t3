<span class="ltx_p" id="A15.I20.i1.p1.1"><span class="ltx_text" id="A15.I20.i1.p1.1.1" style="--ltx-fg-color:#000000;">Return ONLY a JSON object: "query": "…"</span></span>
</span></span>
