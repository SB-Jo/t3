<span class="ltx_para" id="A15.I19.i1.p1">
<span class="ltx_p" id="A15.I19.i1.p1.1"><span class="ltx_text" id="A15.I19.i1.p1.1.1" style="--ltx-fg-color:#000000;">Construct a focused, concise text query </span><math alttext="q_{\text{next}}" class="ltx_Math" display="inline" id="A15.I19.i1.p1.m1" intent=":literal" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><msub><mi mathcolor="#000000" style="--ltx-fg-color:#000000;">q</mi><mtext mathcolor="#000000" style="--ltx-fg-color:#000000;">next</mtext></msub><annotation encoding="application/x-tex">q_{\text{next}}</annotation></semantics></math><span class="ltx_text" id="A15.I19.i1.p1.1.2" style="--ltx-fg-color:#000000;"> that will help satisfy the outstanding needs.</span></span>
