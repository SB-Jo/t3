<span class="ltx_para" id="A15.I19.i2.p1">
<span class="ltx_p" id="A15.I19.i2.p1.1"><span class="ltx_text" id="A15.I19.i2.p1.1.1" style="--ltx-fg-color:#000000;">The query should incorporate any necessary entities from known facts in the retrieved docs.</span></span>
</span></span>
