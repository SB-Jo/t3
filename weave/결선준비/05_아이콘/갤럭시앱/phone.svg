<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Samsung Phone (One UI 7~8.5) 아이콘을 공식 홍보 이미지(added_0926/ref/nudge.png)와 S25·S26 홈 화면 사진을 보고 그림.
       바탕: 연두 → 초록 세로 그라데이션, 흰 수화기(살짝 민트빛). 모서리 모양은 make_galaxy_icons.py가 공식 캘린더 아이콘의 윤곽으로 자름 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86E06E"/>
      <stop offset="1" stop-color="#45AA5E"/>
    </linearGradient>
    <linearGradient id="hs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F5E1"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shade)"/>
  <g transform="translate(250 256) rotate(45) scale(12.9) translate(-12 -12)">
    <path fill="url(#hs)" stroke="url(#hs)" stroke-width="0.55" stroke-linejoin="round" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
  </g>
</svg>
