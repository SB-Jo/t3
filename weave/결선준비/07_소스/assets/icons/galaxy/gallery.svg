<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Samsung Gallery (One UI 7~8.5) 아이콘을 공식 홍보 이미지(added_0926/ref/nudge.png)와 S25·S26 홈 화면 사진을 보고 그림.
       바탕: 왼쪽 보라 → 위 분홍 → 오른쪽 주황, 꽃: 흰 꽃잎 3장 + 반투명 꽃잎 3장, 주황 가운데. 모서리 모양은 make_galaxy_icons.py가 공식 캘린더 아이콘의 윤곽으로 자름 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0.6" x2="1" y2="0.4">
      <stop offset="0" stop-color="#B42FF2"/>
      <stop offset="0.36" stop-color="#DA3598"/>
      <stop offset="0.62" stop-color="#EC3F56"/>
      <stop offset="1" stop-color="#F7852B"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shade)"/>
  <g transform="translate(256 258)">
    <g fill="#fff" fill-opacity=".72">
      <ellipse cx="0" cy="-118" rx="53" ry="72" transform="rotate(60)"/>
      <ellipse cx="0" cy="-118" rx="53" ry="72" transform="rotate(180)"/>
      <ellipse cx="0" cy="-118" rx="53" ry="72" transform="rotate(300)"/>
    </g>
    <g fill="#fff">
      <ellipse cx="0" cy="-118" rx="53" ry="72"/>
      <ellipse cx="0" cy="-118" rx="53" ry="72" transform="rotate(120)"/>
      <ellipse cx="0" cy="-118" rx="53" ry="72" transform="rotate(240)"/>
    </g>
    <circle r="35" fill="#F2762B"/>
  </g>
</svg>
