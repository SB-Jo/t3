<!doctype html>
<meta charset="utf-8">
<!-- 갤럭시(One UI 8) 카메라 앱 아이콘을 보고 그린 그림. 시스템 앱이라 스토어 웹에서 받을 수 없어서 갤러리 아이콘(05_아이콘/갤럭시앱/gallery.svg)처럼 그렸다.
     찍기: node tools/shot.cjs assets/src/camera.html assets/hook  →  camera_raw.png (tools/hook_assets.py가 갤러리 아이콘의 테두리 모양으로 잘라 samsung-camera.png로) -->
<style>
  body { margin: 0; background: transparent; }
  .shot { width: 512px; height: 512px; }
</style>
<svg class="shot" data-name="camera_raw" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#DADDE2"/><stop offset="0.55" stop-color="#C3C7CE"/><stop offset="1" stop-color="#A9AEB7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2A2B30"/><stop offset="1" stop-color="#0C0C0F"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B63D8"/><stop offset="1" stop-color="#35D0D8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#3A4050" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="72" y="106" width="368" height="300" rx="40" fill="url(#body)" filter="url(#sh)"/>
  <circle cx="256" cy="258" r="108" fill="url(#lens)"/>
  <circle cx="256" cy="258" r="68" fill="#4A4C53"/>
  <path d="M 256 190 A 68 68 0 0 1 324 258 L 290 258 A 34 34 0 0 0 256 224 Z" fill="url(#arc)"/>
  <circle cx="256" cy="258" r="34" fill="#08080A"/>
  <circle cx="128" cy="162" r="18" fill="#EE3B36"/>
</svg>
